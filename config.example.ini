# Example configuration – normally written by the app itself.
# Location: ~/.config/tapo-desktop/config.ini, or tapo-desktop.ini next to the
# executable (portable mode). Comments must be on their own line.

[settings]
# hd = stream1, sd = stream2
start_quality = hd
audio = on
# 0.1 .. 1.0 (Shift = full speed)
ptz_speed = 0.50
# on for ceiling mounts
ptz_invert = off
# 1 = lowest latency
decoder_threads = 2
# tcp | udp
transport = tcp
startup_timeout = 8
stall_timeout = 5
# switch HD <-> SD after N failed attempts, 0 = never
failover_after = 2
media_dir = ~/Videos/Tapo Desktop

[camera]
name = Living room
# camera IP (documentation example address)
host = 192.0.2.10
# Camera Account from the Tapo app (not the TP-Link ID)
user = camera-account-user
password = camera-account-password
rtsp_port = 554
onvif_port = 2020
stream_hd = stream1
stream_sd = stream2
